      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NowPlaying.apk
          gh release delete latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest NowPlaying.apk --repo ${{ github.repository }} --title "최신 빌드" --notes "자동 빌드"
