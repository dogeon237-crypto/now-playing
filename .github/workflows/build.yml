          package com.example.nowplaying

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import androidx.core.graphics.ColorUtils
          import androidx.palette.graphics.Palette
          import java.net.HttpURLConnection
          import java.net.URL

          object Art {

              private fun hiResUrl(url: String): String =
                  if (url.contains("googleusercontent.com") || url.contains("ggpht.com"))
                      url.replace(Regex("""=[wsh]\d+[^/]*$"""), "=w1200-h1200-l90-rj")
                  else url

              fun load(context: Context, uri: String?): Bitmap? {
                  if (uri.isNullOrBlank()) return null
                  return try {
                      if (uri.startsWith("http")) {
                          download(hiResUrl(uri)) ?: download(uri)
                      } else {
                          context.contentResolver.openInputStream(Uri.parse(uri))?.use { BitmapFactory.decodeStream(it) }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun download(url: String): Bitmap? = try {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 8000
                  c.readTimeout = 8000
                  if (c.responseCode != 200) null else c.inputStream.use { BitmapFactory.decodeStream(it) }
              } catch (e: Exception) {
                  null
              }

              fun accentColor(bmp: Bitmap): Int? {
                  val p = Palette.from(bmp).maximumColorCount(16).generate()
                  val sw = p.vibrantSwatch ?: p.darkVibrantSwatch ?: p.mutedSwatch ?: p.dominantSwatch ?: return null
                  val hsl = sw.hsl.copyOf()
                  hsl[2] = hsl[2].coerceIn(0.28f, 0.45f)
                  return ColorUtils.HSLToColor(hsl)
              }
          }
