          package com.example.nowplaying

          import android.content.Context
          import com.atilika.kuromoji.ipadic.Tokenizer
          import com.worksap.nlp.sudachi.Config
          import com.worksap.nlp.sudachi.DictionaryFactory
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import java.io.BufferedInputStream
          import java.io.File
          import java.io.FilterInputStream
          import java.io.InputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.ZipInputStream
          import com.worksap.nlp.sudachi.Tokenizer as SudachiTokenizer

          object Japanese {

              private class Morph(
                  val surface: String,
                  val reading: String?,
                  val pos: String,
                  val known: Boolean,
                  val isPronunciation: Boolean,   // true면 장음(ー)까지 들어간 발음, false면 글자 그대로의 읽기
              )

              private const val DICT_URL =
                  "https://github.com/WorksApplications/SudachiDict/releases/download/v20260116/sudachi-dictionary-20260116-core.zip"
              private const val DICT_FILE = "sudachi_core_20260116.dic"

              private val kuromoji: Tokenizer by lazy { Tokenizer() }

              @Volatile
              private var sudachi: SudachiTokenizer? = null

              private val _status = MutableStateFlow<String?>(null)
              val status: StateFlow<String?> = _status

              private val DEFAULT_FIXES = listOf(
                  "今" to "イマ",
                  "二人" to "フタリ",
                  "一人" to "ヒトリ",
              )

              @Volatile
              private var fixes: List<Pair<String, String>> = DEFAULT_FIXES.sortedByDescending { it.first.length }

              fun init(context: Context) {
                  loadFixes(context)
                  val app = context.applicationContext
                  Thread {
                      try { kuromoji.tokenize("今") } catch (e: Throwable) {}
                      prepareSudachi(app)
                  }.start()
              }

              private fun loadFixes(context: Context) {
                  try {
                      val user = context.assets.open("fixes.txt").bufferedReader().readLines()
                          .map { it.substringBefore("#").trim() }
                          .filter { it.contains("=") }
                          .map { it.substringBefore("=").trim() to it.substringAfter("=").trim() }
                          .filter { it.first.isNotEmpty() && it.second.isNotEmpty() }
                      fixes = (user + DEFAULT_FIXES).distinctBy { it.first }.sortedByDescending { it.first.length }
                  } catch (e: Exception) {
                  }
              }

              private fun prepareSudachi(context: Context) {
                  try {
                      val dic = File(context.filesDir, DICT_FILE)
                      if (!dic.exists() || dic.length() < 1_000_000) downloadDict(dic)
                      _status.value = "일본어 사전 불러오는 중…"
                      val config = Config.defaultConfig().systemDictionary(dic.toPath())
                      sudachi = DictionaryFactory().create(config).create()
                      _status.value = null
                  } catch (e: Throwable) {
                      sudachi = null
                      _status.value = "최신 일본어 사전을 쓰지 못했어요 (기존 사전 사용): " + (e.message ?: e.javaClass.simpleName).take(80)
                      Thread.sleep(8000)
                      _status.value = null
                  }
              }

              private fun downloadDict(target: File) {
                  _status.value = "일본어 사전 내려받는 중… 0%"
                  val tmp = File(target.parentFile, "$DICT_FILE.part")
                  val c = URL(DICT_URL).openConnection() as HttpURLConnection
                  c.instanceFollowRedirects = true
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  val total = c.contentLengthLong
                  val counting = object : FilterInputStream(c.inputStream) {
                      var count = 0L
                      var lastPct = -1
                      private fun add(n: Int) {
                          if (n <= 0) return
                          count += n
                          if (total > 0) {
                              val pct = (count * 100 / total).toInt()
                              if (pct != lastPct) {
                                  lastPct = pct
                                  _status.value = "일본어 사전 내려받는 중… $pct%"
                              }
                          }
                      }
                      override fun read(): Int = super.read().also { if (it >= 0) add(1) }
                      override fun read(b: ByteArray, off: Int, len: Int): Int = super.read(b, off, len).also { add(it) }
                  }
                  ZipInputStream(BufferedInputStream(counting as InputStream)).use { zin ->
                      var e = zin.nextEntry
                      while (e != null) {
                          if (e.name.endsWith(".dic")) {
                              tmp.outputStream().use { out -> zin.copyTo(out, 64 * 1024) }
                              break
                          }
                          e = zin.nextEntry
                      }
                  }
                  c.disconnect()
                  if (!tmp.exists() || tmp.length() < 1_000_000) throw IllegalStateException("사전 파일을 찾지 못했어요")
                  if (!tmp.renameTo(target)) throw IllegalStateException("사전 파일을 저장하지 못했어요")
              }

              private fun morphs(text: String): List<Morph> {
                  val s = sudachi
                  if (s != null) {
                      try {
                          return s.tokenize(SudachiTokenizer.SplitMode.C, text).map { m ->
                              Morph(m.surface(), m.readingForm(), m.partOfSpeech().firstOrNull() ?: "", !m.isOOV(), false)
                          }
                      } catch (e: Throwable) {
                      }
                  }
                  return kuromoji.tokenize(text).map { t ->
                      Morph(t.surface, t.pronunciation, t.partOfSpeechLevel1, t.isKnown, true)
                  }
              }

              private fun isKanji(c: Char) = c.code in 0x4E00..0x9FFF || c == '々'

              private fun validReading(r: String?) = !r.isNullOrEmpty() && r != "*" && r.none { isKanji(it) }

              private const val A_ROW = "アカガサザタダナハバパマヤャラワァ"
              private const val I_ROW = "イキギシジチヂニヒビピミリィ"
              private const val U_ROW = "ウクグスズツヅヌフブプムユュルヴゥ"
              private const val E_ROW = "エケゲセゼテデネヘベペメレェ"
              private const val O_ROW = "オコゴソゾトドノホボポモヨョロヲォ"

              private fun lengthen(kata: String): String {
                  val sb = StringBuilder()
                  for (c in kata) {
                      val prev = sb.lastOrNull()
                      val long = prev != null && (
                          (c == 'ウ' && (prev in O_ROW || prev in U_ROW)) ||
                              (c == 'イ' && prev in E_ROW)
                          )
                      sb.append(if (long) 'ー' else c)
                  }
                  return sb.toString()
              }

              private fun readingOf(m: Morph): String {
                  if (m.known && validReading(m.reading)) {
                      val r = m.reading!!
                      return if (!m.isPronunciation && m.pos in setOf("名詞", "代名詞", "接頭辞", "接尾辞")) lengthen(r) else r
                  }
                  if (m.surface.none { isKanji(it) }) return m.surface
                  val sb = StringBuilder()
                  for (ch in m.surface) {
                      if (!isKanji(ch)) {
                          sb.append(ch)
                          continue
                      }
                      val one = morphs(ch.toString()).firstOrNull()
                      sb.append(if (one != null && validReading(one.reading)) one.reading else ch.toString())
                  }
                  return sb.toString()
              }

              private fun matchLen(ms: List<Morph>, start: Int, key: String): Int {
                  val acc = StringBuilder()
                  var j = start
                  while (j < ms.size && acc.length < key.length) {
                      acc.append(ms[j].surface)
                      j++
                      if (acc.toString() == key) return j - start
                  }
                  return 0
              }

              @Synchronized
              fun pronounce(line: String): String {
                  val ms = morphs(line)
                  val sb = StringBuilder()
                  var i = 0
                  while (i < ms.size) {
                      var fixed = false
                      for ((key, r) in fixes) {
                          val n = matchLen(ms, i, key)
                          if (n > 0) {
                              sb.append(r)
                              i += n
                              fixed = true
                              break
                          }
                      }
                      if (fixed) continue

                      val m = ms[i]
                      var reading = readingOf(m)
                      if (m.pos == "助詞") {
                          if (m.surface == "は") reading = "ワ"
                          if (m.surface == "へ") reading = "エ"
                          if (m.surface == "を") reading = "オ"
                      }
                      sb.append(reading)
                      val next = ms.getOrNull(i + 1)
                      if (next != null && m.pos == "助詞" &&
                          next.pos !in setOf("助詞", "助動詞", "記号", "補助記号", "空白")
                      ) sb.append(' ')
                      i++
                  }
                  return KanaHangul.convert(sb.toString()).replace(Regex(" +"), " ").trim()
              }

              fun addPronunciation(lines: List<LyricLine>): List<LyricLine> {
                  if (lines.none { KanaHangul.hasKana(it.text) }) return lines
                  return lines.map { if (KanaHangul.hasJapanese(it.text)) it.copy(pron = pronounce(it.text)) else it }
              }
          }
