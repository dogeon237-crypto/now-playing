name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/example/nowplaying app/src/main/assets
          if [ -f fixes.txt ]; then cp fixes.txt app/src/main/assets/fixes.txt; fi
          echo '' | base64 -d > app/debug.keystore
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NowPlaying"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.nowplaying"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.nowplaying"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 9
                  versionName = "1.8"
              }

              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              packaging {
                  resources.excludes += setOf("META-INF/*.md", "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/DEPENDENCIES")
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.palette:palette-ktx:1.0.0")
              implementation("com.atilika.kuromoji:kuromoji-ipadic:0.9.0")
              implementation("com.worksap.nlp:sudachi:0.8.1")
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Now Playing"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MediaListener"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/example/nowplaying/MediaListener.kt <<'EOF_FILE'
          package com.example.nowplaying

          import android.service.notification.NotificationListenerService

          class MediaListener : NotificationListenerService()
          EOF_FILE
          cat > app/src/main/java/com/example/nowplaying/NowPlayingTracker.kt <<'EOF_FILE'
          package com.example.nowplaying

          import android.content.ComponentName
          import android.content.Context
          import android.graphics.Bitmap
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import androidx.core.app.NotificationManagerCompat
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow

          data class Track(
              val title: String,
              val artist: String,
              val art: Bitmap?,
              val isPlaying: Boolean,
              val packageName: String,
              val durationMs: Long,
              val artUri: String?,
          )

          class NowPlayingTracker(private val context: Context) {

              private val msm = context.getSystemService(MediaSessionManager::class.java)
              private val component = ComponentName(context, MediaListener::class.java)
              private val handler = Handler(Looper.getMainLooper())

              private val _track = MutableStateFlow<Track?>(null)
              val track: StateFlow<Track?> = _track

              private var current: MediaController? = null

              private val callback = object : MediaController.Callback() {
                  override fun onMetadataChanged(metadata: MediaMetadata?) = update()
                  override fun onPlaybackStateChanged(state: PlaybackState?) = update()
                  override fun onSessionDestroyed() = refresh()
              }

              private val sessionsListener =
                  MediaSessionManager.OnActiveSessionsChangedListener { list -> pick(list.orEmpty()) }

              fun start() {
                  if (!hasPermission(context)) return
                  try {
                      msm.addOnActiveSessionsChangedListener(sessionsListener, component, handler)
                      refresh()
                  } catch (e: SecurityException) {
                  }
              }

              fun stop() {
                  msm.removeOnActiveSessionsChangedListener(sessionsListener)
                  current?.unregisterCallback(callback)
                  current = null
              }

              private fun refresh() {
                  try {
                      pick(msm.getActiveSessions(component))
                  } catch (e: SecurityException) {
                      _track.value = null
                  }
              }

              private fun pick(list: List<MediaController>) {
                  val chosen = list.firstOrNull { it.packageName == YT_MUSIC }
                      ?: list.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      ?: list.firstOrNull()

                  if (chosen?.sessionToken != current?.sessionToken) {
                      current?.unregisterCallback(callback)
                      current = chosen
                      chosen?.registerCallback(callback, handler)
                  }
                  update()
              }

              private fun update() {
                  val c = current
                  val m = c?.metadata
                  if (c == null || m == null) {
                      _track.value = null
                      return
                  }
                  _track.value = Track(
                      title = m.getString(MediaMetadata.METADATA_KEY_TITLE).orEmpty(),
                      artist = m.getString(MediaMetadata.METADATA_KEY_ARTIST)
                          ?: m.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST).orEmpty(),
                      art = listOfNotNull(
                          m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART),
                          m.getBitmap(MediaMetadata.METADATA_KEY_ART),
                          m.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON),
                      ).maxByOrNull { it.width * it.height },
                      isPlaying = c.playbackState?.state == PlaybackState.STATE_PLAYING,
                      packageName = c.packageName,
                      durationMs = m.getLong(MediaMetadata.METADATA_KEY_DURATION),
                      artUri = m.getString(MediaMetadata.METADATA_KEY_ALBUM_ART_URI)
                          ?: m.getString(MediaMetadata.METADATA_KEY_ART_URI)
                          ?: m.getString(MediaMetadata.METADATA_KEY_DISPLAY_ICON_URI),
                  )
              }

              fun positionMs(): Long {
                  val s = current?.playbackState ?: return 0L
                  var p = s.position
                  if (s.state == PlaybackState.STATE_PLAYING && s.lastPositionUpdateTime > 0) {
                      p += ((SystemClock.elapsedRealtime() - s.lastPositionUpdateTime) * s.playbackSpeed).toLong()
                  }
                  return p
              }

              companion object {
                  const val YT_MUSIC = "com.google.android.apps.youtube.music"

                  fun hasPermission(ctx: Context): Boolean =
                      NotificationManagerCompat.getEnabledListenerPackages(ctx).contains(ctx.packageName)
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/nowplaying/Lyrics.kt <<'EOF_FILE'
          package com.example.nowplaying

          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.async
          import kotlinx.coroutines.awaitAll
          import kotlinx.coroutines.coroutineScope
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.Normalizer
          import kotlin.math.abs

          data class LyricLine(val timeMs: Long, val text: String, val pron: String? = null)

          object Lyrics {

              private class Candidate(
                  val source: String,
                  val title: String,
                  val artist: String,
                  val durationMs: Long,
                  val load: () -> String?,
              )

              private class Query(
                  val bases: List<String>,   // 꼬리를 뗀 제목들 (비교용으로 정규화, 괄호 안 원제 포함)
                  val tags: Set<String>,     // 버전 표시 (movie, tv, live ...)
                  val artist: String,
                  val origArtist: String?,   // 커버곡의 원곡 가수
                  val isCover: Boolean,
                  val durationMs: Long,
              )

              private const val UA =
                  "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"

              private val VERSION_WORDS = listOf(
                  "movie" to "movie", "映画" to "movie",
                  "tv size" to "tv", "tvsize" to "tv", "tv ver" to "tv", "tv edit" to "tv", "tvサイズ" to "tv",
                  "live" to "live", "ライブ" to "live",
                  "acoustic" to "acoustic", "remix" to "remix",
                  "instrumental" to "inst", "off vocal" to "inst", "inst." to "inst",
                  "short" to "short", "piano" to "piano", "orchestra" to "orchestra",
              )
              private val COVER_WORDS = listOf("cover", "커버", "歌ってみた", "カバー", "翻唱")
              private val TAIL_HINT = Regex(
                  """(?i)(ver|version|edit|mv|m/v|official|remaster|feat|ft\.|cover|live|acoustic|remix|size|inst|short|lyric|audio|video|movie|歌ってみた)"""
              )

              fun cleanTitle(t: String): String {
                  var s = t.substringBefore(" | ").substringBefore("｜")
                  s = s.replace(Regex("""\s*[(\[【（〔「『].*?[)\]】）〕」』]"""), " ").trim()
                  Regex("""\s+[-–—~〜/]\s+(.*)$""").find(s)?.let { m ->
                      if (TAIL_HINT.containsMatchIn(m.groupValues[1]) || m.value.trimStart().startsWith("/")) {
                          s = s.substring(0, m.range.first)
                      }
                  }
                  s = s.replace(Regex("""(?i)\s+(feat\.?|ft\.)\s.*$"""), "")
                  s = s.replace(Regex("""(?i)\s+(official\s+(music\s+)?video|official\s+audio|lyric\s+video|m/?v)\s*$"""), "")
                  return s.trim().ifEmpty { t.trim() }
              }

              private fun norm(s: String): String =
                  Normalizer.normalize(s, Normalizer.Form.NFKC).lowercase().replace(Regex("""[\s\p{P}\p{S}]"""), "")

              private fun versionTags(title: String, base: String): Set<String> =
                  tagsOf(if (base.isEmpty()) title else title.replace(base, " "))

              private fun tagsOf(text: String): Set<String> {
                  val tail = text.lowercase()
                  return VERSION_WORDS.filter { (w, _) ->
                      if (w.all { it.code < 128 }) Regex("(?<![a-z])" + Regex.escape(w) + "(?![a-z])").containsMatchIn(tail)
                      else tail.contains(w)
                  }.map { it.second }.toSet()
              }

              private fun artistMatch(a: String?, b: String?): Boolean {
                  val na = norm(a ?: ""); val nb = norm(b ?: "")
                  return na.isNotEmpty() && nb.isNotEmpty() && (na.contains(nb) || nb.contains(na))
              }

              private fun originalArtist(title: String, artist: String): String? {
                  val parts = Regex("""[(（]([^)）]{1,40})[)）]""").findAll(title).map { it.groupValues[1].trim() }.toMutableList()
                  Regex("""\s/\s([^|【\[(\]）)]+)""").find(title)?.let { parts += it.groupValues[1].trim() }
                  return parts.firstOrNull { p ->
                      val l = p.lowercase()
                      COVER_WORDS.none { l.contains(it) } && tagsOf(p).isEmpty() &&
                          !artistMatch(p, artist) && !l.contains("ver") && !l.contains("feat")
                  }
              }

              private fun altTitles(title: String, artist: String): List<Pair<String, String?>> =
                  Regex("""[\[(【（「『]([^\]\)】）」』]{1,60})[\]\)】）」』]""").findAll(title).mapNotNull { m ->
                      val inner = m.groupValues[1].trim()
                      val parts = inner.split(Regex("""\s*[/／]\s*"""))
                      val t = parts[0].trim()
                      val a = parts.getOrNull(1)?.trim()?.ifEmpty { null }
                      val l = t.lowercase()
                      val looksLikeTitle = a != null || t.any { it.code in 0x3040..0x30FF || it.code in 0x4E00..0x9FFF }
                      if (t.isEmpty() || !looksLikeTitle || COVER_WORDS.any { l.contains(it) } || tagsOf(t).isNotEmpty() ||
                          artistMatch(t, artist) || l.contains("ver") || l.contains("feat")
                      ) null else t to a
                  }.distinctBy { it.first }.take(2).toList()

              private fun score(c: Candidate, q: Query): Double? {
                  val cBaseRaw = cleanTitle(c.title)
                  val cBase = norm(cBaseRaw)
                  if (cBase.isEmpty() || q.bases.isEmpty()) return null
                  val titleS = q.bases.maxOf { b ->
                      when {
                          cBase == b -> 3.0
                          cBase.contains(b) || b.contains(cBase) -> 1.5
                          else -> 0.0
                      }
                  }
                  if (titleS == 0.0) return null
                  val cTags = versionTags(c.title, cBaseRaw)
                  val verS = when {
                      cTags == q.tags -> 2.0
                      q.tags.isEmpty() -> -2.0
                      cTags.isEmpty() -> -1.0
                      else -> -1.5
                  }
                  val artistOk = artistMatch(c.artist, q.artist) || artistMatch(c.artist, q.origArtist)
                  val diffS = if (q.durationMs > 0 && c.durationMs > 0) abs(c.durationMs - q.durationMs) / 1000.0 else 0.0
                  val limit = when {
                      artistOk -> 60.0
                      q.isCover -> 45.0
                      else -> 8.0
                  }
                  if (diffS > limit) return null
                  val sourceBonus = if (c.source == "lrclib") 0.3 else 0.0
                  return titleS + verS + (if (artistOk) 2.0 else 0.0) - (diffS / 10.0).coerceAtMost(3.0) + sourceBonus
              }

              suspend fun fetch(artistRaw: String, title: String, durationMs: Long): List<LyricLine>? = coroutineScope {
                  val artist = artistRaw.removeSuffix(" - Topic").trim()
                  val base = cleanTitle(title)
                  val lower = (title + " " + artist).lowercase()
                  val isCover = COVER_WORDS.any { lower.contains(it) }
                  val alts = altTitles(title, artist)
                  val orig = if (isCover) (alts.firstNotNullOfOrNull { it.second } ?: originalArtist(title, artist)) else null
                  val bases = (listOf(base) + alts.map { it.first }).map { norm(it) }.filter { it.isNotEmpty() }.distinct()
                  val q = Query(bases, versionTags(title, base), artist, orig, isCover, durationMs)
                  val who = if (isCover) (orig ?: "") else artist
                  val keyword = "$base $who".trim()

                  val jobs = mutableListOf(
                      async(Dispatchers.IO) { safe { lrclib(base, who.ifEmpty { null }) } },
                      async(Dispatchers.IO) { safe { lrclib(base, null) } },
                      async(Dispatchers.IO) { safe { netease(keyword) } },
                      async(Dispatchers.IO) { safe { qq(keyword) } },
                      async(Dispatchers.IO) { safe { kugou(keyword) } },
                  )
                  for ((altT, altA) in alts) {
                      val altWho = altA ?: who
                      val altKey = "$altT $altWho".trim()
                      jobs += async(Dispatchers.IO) { safe { lrclib(altT, altWho.ifEmpty { null }) } }
                      jobs += async(Dispatchers.IO) { safe { lrclib(altT, null) } }
                      jobs += async(Dispatchers.IO) { safe { netease(altKey) } }
                      jobs += async(Dispatchers.IO) { safe { qq(altKey) } }
                      jobs += async(Dispatchers.IO) { safe { kugou(altKey) } }
                  }
                  val results = jobs.awaitAll().flatten()

                  val ranked = results.mapNotNull { c -> score(c, q)?.let { c to it } }.sortedByDescending { it.second }
                  for ((c, _) in ranked.take(5)) {
                      val lrc = try { c.load() } catch (e: Exception) { null } ?: continue
                      val lines = removeCredits(parse(lrc))
                      if (lines.count { it.text.isNotBlank() } >= 3) return@coroutineScope lines
                  }
                  null
              }

              private fun safe(block: () -> List<Candidate>): List<Candidate> =
                  try { block() } catch (e: Exception) { emptyList() }

              private fun lrclib(title: String, artist: String?): List<Candidate> {
                  var url = "https://lrclib.net/api/search?track_name=" + enc(title)
                  if (artist != null) url += "&artist_name=" + enc(artist)
                  val arr = JSONArray(get(url, mapOf("User-Agent" to "NowPlaying Android app")) ?: return emptyList())
                  return (0 until arr.length()).mapNotNull { i ->
                      val o = arr.getJSONObject(i)
                      val synced = o.optString("syncedLyrics", "")
                      if (synced.isBlank() || synced == "null") null
                      else Candidate(
                          "lrclib", o.optString("trackName"), o.optString("artistName"),
                          (o.optDouble("duration", 0.0) * 1000).toLong(), load = { synced },
                      )
                  }
              }

              private fun netease(keyword: String): List<Candidate> {
                  val ref = mapOf("Referer" to "https://music.163.com/")
                  val body = get("https://music.163.com/api/search/get?type=1&limit=10&offset=0&s=" + enc(keyword), ref)
                      ?: return emptyList()
                  val songs = JSONObject(body).optJSONObject("result")?.optJSONArray("songs") ?: return emptyList()
                  return (0 until songs.length()).map { i ->
                      val o = songs.getJSONObject(i)
                      val id = o.optLong("id")
                      val ar = o.optJSONArray("artists") ?: o.optJSONArray("ar")
                      val artist = (0 until (ar?.length() ?: 0)).joinToString(" ") { ar!!.getJSONObject(it).optString("name") }
                      val dur = if (o.has("duration")) o.optLong("duration") else o.optLong("dt")
                      Candidate("netease", o.optString("name"), artist, dur, load = fun(): String? {
                          val s = get("https://music.163.com/api/song/lyric?id=$id&lv=1&kv=1&tv=-1", ref) ?: return null
                          return JSONObject(s).optJSONObject("lrc")?.optString("lyric")
                      })
                  }
              }

              private fun qq(keyword: String): List<Candidate> {
                  val ref = mapOf("Referer" to "https://y.qq.com/")
                  val payload = JSONObject().put(
                      "req", JSONObject()
                          .put("module", "music.search.SearchCgiService")
                          .put("method", "DoSearchForQQMusicDesktop")
                          .put("param", JSONObject().put("query", keyword).put("num_per_page", 10).put("page_num", 1).put("search_type", 0))
                  )
                  val body = post("https://u.y.qq.com/cgi-bin/musicu.fcg", payload.toString(), ref) ?: return emptyList()
                  val list = JSONObject(body).optJSONObject("req")?.optJSONObject("data")?.optJSONObject("body")
                      ?.optJSONObject("song")?.optJSONArray("list") ?: return emptyList()
                  return (0 until list.length()).map { i ->
                      val o = list.getJSONObject(i)
                      val mid = o.optString("mid")
                      val sg = o.optJSONArray("singer")
                      val artist = (0 until (sg?.length() ?: 0)).joinToString(" ") { sg!!.getJSONObject(it).optString("name") }
                      Candidate("qq", o.optString("name"), artist, o.optLong("interval") * 1000, load = fun(): String? {
                          val s = get(
                              "https://c.y.qq.com/lyric/fcgi-bin/fcg_query_lyric_new.fcg?songmid=$mid&format=json&nobase64=1&g_tk=5381",
                              ref,
                          ) ?: return null
                          val start = s.indexOf('{')
                          if (start < 0) return null
                          val lyric = JSONObject(s.substring(start)).optString("lyric")
                          return decodeEntities(lyric)
                      })
                  }
              }

              private fun kugou(keyword: String): List<Candidate> {
                  val body = get("https://mobiles.kugou.com/api/v3/search/song?format=json&page=1&pagesize=10&showtype=1&keyword=" + enc(keyword))
                      ?: return emptyList()
                  val info = JSONObject(body).optJSONObject("data")?.optJSONArray("info") ?: return emptyList()
                  return (0 until info.length()).map { i ->
                      val o = info.getJSONObject(i)
                      val hash = o.optString("hash")
                      val dur = o.optLong("duration") * 1000
                      Candidate("kugou", o.optString("songname"), o.optString("singername"), dur, load = fun(): String? {
                          val s = get("https://krcs.kugou.com/search?ver=1&man=yes&client=mobi&keyword=&duration=$dur&hash=$hash")
                              ?: return null
                          val c = JSONObject(s).optJSONArray("candidates")?.optJSONObject(0) ?: return null
                          val d = get(
                              "https://lyrics.kugou.com/download?ver=1&client=pc&fmt=lrc&charset=utf8&id=" +
                                  c.optString("id") + "&accesskey=" + c.optString("accesskey")
                          ) ?: return null
                          val content = JSONObject(d).optString("content")
                          if (content.isEmpty()) return null
                          return String(Base64.decode(content, Base64.DEFAULT), Charsets.UTF_8)
                      })
                  }
              }

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8")

              private fun get(url: String, headers: Map<String, String> = emptyMap()) = request(url, null, headers)

              private fun post(url: String, body: String, headers: Map<String, String>) = request(url, body, headers)

              private fun request(url: String, body: String?, headers: Map<String, String>): String? = try {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 6000
                  c.readTimeout = 6000
                  c.setRequestProperty("User-Agent", UA)
                  headers.forEach { (k, v) -> c.setRequestProperty(k, v) }
                  if (body != null) {
                      c.requestMethod = "POST"
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.outputStream.use { it.write(body.toByteArray()) }
                  }
                  if (c.responseCode !in 200..299) null else c.inputStream.bufferedReader().use { it.readText() }
              } catch (e: Exception) {
                  null
              }

              private fun decodeEntities(s: String): String =
                  s.replace(Regex("&#(\\d+);")) { it.groupValues[1].toInt().toChar().toString() }
                      .replace("&quot;", "\"").replace("&apos;", "'").replace("&lt;", "<").replace("&gt;", ">")
                      .replace("&amp;", "&")

              private val CREDIT = Regex("""^[^\s:：]{1,10}\s*[:：]""")

              private fun removeCredits(lines: List<LyricLine>): List<LyricLine> =
                  lines.filterNot { it.timeMs < 40_000 && it.text.length < 60 && CREDIT.containsMatchIn(it.text) }

              fun parse(lrc: String): List<LyricLine> {
                  val tag = Regex("""\[(\d+):(\d+(?:\.\d+)?)]""")
                  val out = mutableListOf<LyricLine>()
                  for (raw in lrc.lines()) {
                      val tags = tag.findAll(raw).toList()
                      if (tags.isEmpty()) continue
                      val text = raw.substring(tags.last().range.last + 1).trim()
                      for (t in tags) {
                          val ms = t.groupValues[1].toLong() * 60_000 +
                              (t.groupValues[2].toDouble() * 1000).toLong()
                          out += LyricLine(ms, text)
                      }
                  }
                  return out.sortedBy { it.timeMs }
              }
          }
