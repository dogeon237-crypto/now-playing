          cat > app/src/main/java/com/example/nowplaying/KanaHangul.java <<'EOF_FILE'
          package com.example.nowplaying;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public final class KanaHangul {

              private static final int A = 0, YA = 2, E = 5, O = 8, YO = 12, U = 13, YU = 17, EU = 18, I = 20;
              private static final int FINAL_N = 4, FINAL_S = 19;

              private static final Map<Character, int[]> BASE = new HashMap<>();

              private static void put(String kana, int initial, int... vowels) {
                  for (int i = 0; i < kana.length(); i++) BASE.put(kana.charAt(i), new int[]{initial, vowels[i]});
              }

              static {
                  put("アイウエオ", 11, A, I, U, E, O);
                  put("カキクケコ", 15, A, I, U, E, O);
                  put("ガギグゲゴ", 0, A, I, U, E, O);
                  put("サシスセソ", 9, A, I, EU, E, O);
                  put("ザジズゼゾ", 12, A, I, EU, E, O);
                  put("タチツテト", 16, A, I, EU, E, O);
                  put("ダヂヅデド", 3, A, I, EU, E, O);
                  put("ナニヌネノ", 2, A, I, U, E, O);
                  put("ハヒフヘホ", 18, A, I, U, E, O);
                  put("バビブベボ", 7, A, I, U, E, O);
                  put("パピプペポ", 17, A, I, U, E, O);
                  put("マミムメモ", 6, A, I, U, E, O);
                  put("ヤユヨ", 11, YA, YU, YO);
                  put("ラリルレロ", 5, A, I, U, E, O);
                  put("ワヲ", 11, 9, O);
                  put("ヴ", 7, U);
                  BASE.put('チ', new int[]{14, I});
                  BASE.put('ツ', new int[]{14, EU});
                  BASE.put('ヂ', new int[]{12, I});
                  BASE.put('ヅ', new int[]{12, EU});
              }

              private static final class Unit {
                  int initial = -1, vowel, fin;   // initial < 0 이면 일반 문자
                  String raw;
                  boolean fromU;                  // 'ウ'에서 왔는지 (ウィ→위 처리용)
                  boolean fromFu;                 // 'フ'에서 왔는지 (ファ→파 처리용)
              }

              public static String convert(String text) {
                  List<Unit> out = new ArrayList<>();
                  for (int i = 0; i < text.length(); i++) {
                      char c = text.charAt(i);
                      if (c >= 'ぁ' && c <= 'ゖ') c = (char) (c + 0x60); // 히라가나 → 가타카나
                      Unit last = out.isEmpty() ? null : out.get(out.size() - 1);
                      boolean lastIsSyllable = last != null && last.initial >= 0;

                      int[] base = BASE.get(c);
                      if (base != null) {
                          Unit u = new Unit();
                          u.initial = base[0];
                          u.vowel = base[1];
                          u.fromU = c == 'ウ';
                          u.fromFu = c == 'フ';
                          out.add(u);
                      } else if ((c == 'ャ' || c == 'ュ' || c == 'ョ') && lastIsSyllable) {
                          last.vowel = c == 'ャ' ? YA : c == 'ュ' ? YU : YO;   // キャ→캬
                      } else if ("ァィゥェォ".indexOf(c) >= 0 && lastIsSyllable) {
                          int v = "ァィゥェォ".indexOf(c);
                          if (last.fromU) {
                              last.vowel = new int[]{9, 16, U, 15, 14}[v];     // ウィ→위, ウォ→워
                          } else {
                              last.vowel = new int[]{A, I, U, E, O}[v];        // ティ→티
                              if (last.fromFu) last.initial = 17;              // ファ→파, フィ→피
                          }
                      } else if (c == 'ッ') {
                          if (lastIsSyllable && last.fin == 0) last.fin = FINAL_S;   // ッ → ㅅ 받침
                      } else if (c == 'ン') {
                          if (lastIsSyllable && last.fin == 0) last.fin = FINAL_N;   // ン → ㄴ 받침
                          else addRaw(out, "ㄴ");
                      } else if (c == 'ー') { if (lastIsSyllable || (last != null && "-".equals(last.raw))) addRaw(out, "-"); } else if (c == 'ゝ' || c == 'ヽ') {
                      } else if (c == 'ァ' || c == 'ィ' || c == 'ゥ' || c == 'ェ' || c == 'ォ'
                              || c == 'ャ' || c == 'ュ' || c == 'ョ') {
                          int[] b = BASE.get((char) (c + 1));   // 앞 글자 없이 나온 작은 글자
                          if (b != null) {
                              Unit u = new Unit();
                              u.initial = b[0];
                              u.vowel = b[1];
                              out.add(u);
                          }
                      } else if (c == '　') {
                          addRaw(out, " ");
                      } else {
                          addRaw(out, String.valueOf(c));
                      }
                  }
                  StringBuilder sb = new StringBuilder();
                  for (Unit u : out) {
                      if (u.initial < 0) sb.append(u.raw);
                      else sb.append((char) (0xAC00 + (u.initial * 21 + u.vowel) * 28 + u.fin));
                  }
                  return sb.toString();
              }

              private static void addRaw(List<Unit> out, String s) {
                  Unit u = new Unit();
                  u.raw = s;
                  out.add(u);
              }

              public static boolean hasKana(String s) {
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if (c >= 'ぁ' && c <= 'ヿ') return true;
                  }
                  return false;
              }

              public static boolean hasJapanese(String s) {
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if ((c >= 'ぁ' && c <= 'ヿ') || (c >= '一' && c <= '鿿') || c == '々') return true;
                  }
                  return false;
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/nowplaying/Japanese.kt <<'EOF_FILE'
          package com.example.nowplaying

          import android.content.Context
          import com.atilika.kuromoji.ipadic.Token
          import com.atilika.kuromoji.ipadic.Tokenizer

          object Japanese {

              private val tokenizer: Tokenizer by lazy { Tokenizer() }

              private val DEFAULT_FIXES = listOf(
                  "今" to "イマ",
                  "二人" to "フタリ",
                  "一人" to "ヒトリ",
              )

              @Volatile
              private var fixes: List<Pair<String, String>> = DEFAULT_FIXES.sortedByDescending { it.first.length }

              fun loadFixes(context: Context) {
                  try {
                      val user = context.assets.open("fixes.txt").bufferedReader().readLines()
                          .map { it.substringBefore("#").trim() }
                          .filter { it.contains("=") }
                          .map { it.substringBefore("=").trim() to it.substringAfter("=").trim() }
                          .filter { it.first.isNotEmpty() && it.second.isNotEmpty() }
                      fixes = (user + DEFAULT_FIXES).distinctBy { it.first }.sortedByDescending { it.first.length }
                  } catch (e: Exception) {
                  }
              }

              fun warmUp() {
                  try { tokenizer.tokenize("今") } catch (e: Throwable) {}
              }

              private fun matchLen(tokens: List<Token>, start: Int, key: String): Int {
                  val acc = StringBuilder()
                  var j = start
                  while (j < tokens.size && acc.length < key.length) {
                      acc.append(tokens[j].surface)
                      j++
                      if (acc.toString() == key) return j - start
                  }
                  return 0
              }

              fun pronounce(line: String): String {
                  val tokens = tokenizer.tokenize(line)
                  val sb = StringBuilder()
                  var i = 0
                  while (i < tokens.size) {
                      var fixed = false
                      for ((key, r) in fixes) {
                          val n = matchLen(tokens, i, key)
                          if (n > 0) {
                              sb.append(r)
                              i += n
                              fixed = true
                              break
                          }
                      }
                      if (fixed) continue

                      val t = tokens[i]
                      val surface = t.surface
                      var reading = t.pronunciation
                      if (reading.isNullOrEmpty() || reading == "*") reading = surface
                      val pos = t.partOfSpeechLevel1
                      if (pos == "助詞") {
                          if (surface == "は") reading = "ワ"
                          if (surface == "へ") reading = "エ"
                      }
                      sb.append(reading)
                      val next = tokens.getOrNull(i + 1)
                      if (next != null && pos == "助詞" &&
                          next.partOfSpeechLevel1 !in setOf("助詞", "助動詞", "記号")
                      ) sb.append(' ')
                      i++
                  }
                  return KanaHangul.convert(sb.toString()).replace(Regex(" +"), " ").trim()
              }

              fun addPronunciation(lines: List<LyricLine>): List<LyricLine> {
                  if (lines.none { KanaHangul.hasKana(it.text) }) return lines
                  return lines.map { if (KanaHangul.hasJapanese(it.text)) it.copy(pron = pronounce(it.text)) else it }
              }
          }
          EOF_FILE
