          cat > app/src/main/java/com/example/nowplaying/Lyrics.kt <<'EOF_FILE'
          package com.example.nowplaying

          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import kotlin.math.abs

          data class LyricLine(val timeMs: Long, val text: String, val pron: String? = null)

          object Lyrics {

              fun fetch(artist: String, title: String, durationMs: Long): List<LyricLine>? {
                  search(artist, title, durationMs)?.let { return it }
                  val clean = title.substringBefore(" | ").substringBefore("｜")
                      .replace(Regex("""\s*[(\[【「].*?[)\]】」]"""), "").trim()
                  if (clean.isNotEmpty() && clean != title) search(artist, clean, durationMs)?.let { return it }
                  if (clean.isNotEmpty() && durationMs > 0) search(null, clean, durationMs, maxDiffMs = 10_000.0)?.let { return it }
                  return null
              }

              private fun search(
                  artist: String?,
                  title: String,
                  durationMs: Long,
                  maxDiffMs: Double = Double.MAX_VALUE,
              ): List<LyricLine>? {
                  return try {
                      var q = "track_name=" + URLEncoder.encode(title, "UTF-8")
                      if (artist != null) q += "&artist_name=" + URLEncoder.encode(artist, "UTF-8")
                      val conn = URL("https://lrclib.net/api/search?$q").openConnection() as HttpURLConnection
                      conn.setRequestProperty("User-Agent", "NowPlaying Android app")
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
                      val body = conn.inputStream.bufferedReader().use { it.readText() }
                      conn.disconnect()

                      val arr = JSONArray(body)
                      var best: String? = null
                      var bestDiff = Double.MAX_VALUE
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val synced = o.optString("syncedLyrics", "")
                          if (synced.isBlank() || synced == "null") continue
                          val diff = if (durationMs > 0) abs(o.optDouble("duration", 0.0) * 1000 - durationMs) else 0.0
                          if (diff < bestDiff && diff <= maxDiffMs) {
                              bestDiff = diff
                              best = synced
                          }
                      }
                      best?.let { parse(it) }?.takeIf { it.isNotEmpty() }
                  } catch (e: Exception) {
                      null
                  }
              }

              fun parse(lrc: String): List<LyricLine> {
                  val tag = Regex("""\[(\d+):(\d+(?:\.\d+)?)]""")
                  val out = mutableListOf<LyricLine>()
                  for (raw in lrc.lines()) {
                      val tags = tag.findAll(raw).toList()
                      if (tags.isEmpty()) continue
                      val text = raw.substring(tags.last().range.last + 1).trim()
                      for (t in tags) {
                          val ms = t.groupValues[1].toLong() * 60_000 +
                              (t.groupValues[2].toDouble() * 1000).toLong()
                          out += LyricLine(ms, text)
                      }
                  }
                  return out.sortedBy { it.timeMs }
              }
          }
