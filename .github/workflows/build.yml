              private lateinit var tracker: NowPlayingTracker
              private var hasPerm by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemBars()

                  Japanese.loadFixes(applicationContext)
                  Thread { Japanese.warmUp() }.start()

                  tracker = NowPlayingTracker(this)
                  setContent {
                      val track by tracker.track.collectAsState()
                      if (hasPerm) {
                          NowPlayingScreen(track, tracker::positionMs)
                      } else {
                          PermissionScreen {
                              startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                          }
                      }
                  }
              }

              override fun onStart() {
                  super.onStart()
                  hasPerm = NowPlayingTracker.hasPermission(this)
                  if (hasPerm) tracker.start()
              }

              override fun onStop() {
                  tracker.stop()
                  super.onStop()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              private fun hideSystemBars() {
                  WindowCompat.getInsetsController(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }
          }

          @Composable
          fun PermissionScreen(onClick: () -> Unit) {
              Column(
                  Modifier.fillMaxSize().background(Color(0xFF1A1414)),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally,
              ) {
                  Text("재생 중인 곡을 보려면 알림 접근 권한이 필요해요", color = Color.White)
                  Spacer(Modifier.height(16.dp))
                  Button(onClick = onClick) { Text("권한 허용하러 가기") }
              }
          }

          @Composable
          fun NowPlayingScreen(track: Track?, positionMs: () -> Long) {
              val context = LocalContext.current

              val hiRes by produceState<Bitmap?>(null, track?.artUri) {
                  value = null
                  value = withContext(Dispatchers.IO) { Art.load(context, track?.artUri) }
              }
              val bitmap = hiRes ?: track?.art
              val art = remember(bitmap) { bitmap?.asImageBitmap() }

              val accent by produceState(DEFAULT_BAND, bitmap) {
                  val c = bitmap?.let { b -> withContext(Dispatchers.Default) { Art.accentColor(b) } }
                  value = c?.let { Color(it) } ?: DEFAULT_BAND
              }
              val band by animateColorAsState(accent, tween(800), label = "band")

              Box(Modifier.fillMaxSize().background(Color(0xFF1A1414))) {
                  if (art != null) {
                      Image(
                          art, null,
                          Modifier.fillMaxSize().blur(30.dp),
                          contentScale = ContentScale.Crop,
                      )
                  }
                  Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.55f)))

                  if (track == null) {
                      Text("재생 중인 곡이 없어요", Modifier.align(Alignment.Center), color = Color.White)
                      return@Box
                  }

                  val rotation = remember { Animatable(0f) }
                  LaunchedEffect(track.isPlaying) {
                      while (track.isPlaying) {
                          rotation.snapTo(rotation.value % 360f)
                          rotation.animateTo(rotation.value + 360f, tween(20_000, easing = LinearEasing))
                      }
                  }

                  Column(
                      Modifier.fillMaxSize().padding(24.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      Text(
                          "${track.artist} - ${track.title}",
                          color = Color.White, fontSize = 30.sp, fontWeight = FontWeight.Bold,
                          maxLines = 1, overflow = TextOverflow.Ellipsis,
                      )
                      Spacer(Modifier.height(16.dp))

                      Row(Modifier.fillMaxWidth().weight(1f), verticalAlignment = Alignment.CenterVertically) {
                          Box(Modifier.weight(1f).fillMaxHeight(), contentAlignment = Alignment.Center) {
                              if (art != null) {
                                  Image(
                                      art, null,
                                      Modifier.fillMaxHeight(0.85f).aspectRatio(1f)
                                          .rotate(rotation.value).clip(CircleShape),
                                      contentScale = ContentScale.Crop,
                                      filterQuality = FilterQuality.High,
                                  )
                              }
                          }

                          Box(Modifier.weight(1.3f).fillMaxHeight()) {
                              LyricsPanel(track, positionMs, band)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LyricsPanel(track: Track, positionMs: () -> Long, bandColor: Color) {
              var lyrics by remember(track.artist, track.title) { mutableStateOf<List<LyricLine>?>(null) }
              var loading by remember(track.artist, track.title) { mutableStateOf(true) }
              LaunchedEffect(track.artist, track.title) {
                  lyrics = withContext(Dispatchers.IO) {
                      val found = Lyrics.fetch(track.artist, track.title, track.durationMs)
                      if (found == null) null
                      else try { Japanese.addPronunciation(found) } catch (e: Throwable) { found }
                  }
                  loading = false
              }

              var pos by remember { mutableLongStateOf(0L) }
              LaunchedEffect(track.artist, track.title) {
                  while (true) {
                      pos = positionMs() + 700
                      delay(100)
                  }
              }

              val lines = lyrics
              val hasPron = lines?.any { it.pron != null } == true
              val lineHeight = if (hasPron) 100.dp else 72.dp

              BoxWithConstraints(
                  Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.25f)),
                  contentAlignment = Alignment.Center,
              ) {
                  var visible = (maxHeight / lineHeight).toInt().coerceIn(1, 5)
                  if (visible % 2 == 0) visible -= 1
                  val half = visible / 2

                  Box(
                      Modifier.fillMaxWidth().height(lineHeight)
                          .background(bandColor.copy(alpha = 0.8f))
                  )

                  if (lines == null) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(
                              track.artist, color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.SemiBold,
                              textAlign = TextAlign.Center, modifier = Modifier.padding(horizontal = 16.dp),
                          )
                          Box(Modifier.height(lineHeight), contentAlignment = Alignment.Center) {
                              if (loading) Text("가사 찾는 중…", color = Color.White.copy(alpha = 0.6f), fontSize = 18.sp)
                          }
                          Text(
                              track.title, color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.SemiBold,
                              textAlign = TextAlign.Center, modifier = Modifier.padding(horizontal = 16.dp),
                          )
                      }
                  } else {
                      val current = lines.indexOfLast { it.timeMs <= pos }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          for (offset in -half..half) {
                              val line = lines.getOrNull(current + offset)
                              val alpha = when (abs(offset)) {
                                  0 -> 1f
                                  1 -> 0.8f
                                  else -> 0.4f
                              }
                              val isCurrent = offset == 0
                              Column(
                                  Modifier.fillMaxWidth().height(lineHeight).padding(horizontal = 16.dp),
                                  verticalArrangement = Arrangement.Center,
                                  horizontalAlignment = Alignment.CenterHorizontally,
                              ) {
                                  Text(
                                      line?.text.orEmpty(),
                                      color = Color.White.copy(alpha = alpha),
                                      fontSize = if (isCurrent) 32.sp else 26.sp,
                                      fontWeight = if (isCurrent) FontWeight.Bold else FontWeight.Normal,
                                      textAlign = TextAlign.Center,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                  )
                                  val pron = line?.pron
                                  if (!pron.isNullOrEmpty()) {
                                      Text(
                                          pron,
                                          color = Color.White.copy(alpha = alpha * 0.85f),
                                          fontSize = if (isCurrent) 20.sp else 17.sp,
                                          textAlign = TextAlign.Center,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis,
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF_FILE

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NowPlaying.apk
          gh release delete latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest NowPlaying.apk --repo ${{ github.repository }} --title "최신 빌드" --notes "자동 빌드"
